name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
      - run: npm run build
      - name: The committed action bundle matches the source
        run: git diff --exit-code action/ apps/web/public/redline.cjs
      - name: Benchmark results match the rules (npm run bench)
        run: npm run bench > /dev/null && git diff --exit-code bench/results.json apps/web/public/benchmark.json
      - name: Redline checks this repository's own Dockerfile
        run: node action/redline.cjs Dockerfile --fail-on low
      - name: End-to-end tests on the demo build
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t redline .
      - name: Smoke test the image
        run: |
          docker run -d -p 8080:8080 --name app redline
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
